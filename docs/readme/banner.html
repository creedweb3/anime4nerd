<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anime4Nerd README banner</title>
<!-- Source of docs/readme/banner.png (the README's top image), in the website's own style: the
     site's CSS, hero heading and before/after frames. Serve the repo root over http and capture
     this page at 1280x460 (device scale 2) in a headless Chromium. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../../site/assets/site.css">
<style>
  html, body { margin: 0; width: 1280px; height: 460px; overflow: hidden; }
  body { background:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 32px 32px, var(--bg); }
  .b { display: grid; grid-template-columns: 560px 1fr; gap: 48px; align-items: center; height: 100%; padding: 0 56px; box-sizing: border-box; }
  .brand { margin: 0 0 26px; font-size: 15px; }
  .phead { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--dim); }
  .hero h1 { font-size: 92px; margin-top: 14px; }
  .lede { font-size: 14px; margin-top: 20px; max-width: 46ch; }
  .tick { display: flex; gap: 8px; margin-top: 22px; }
  .tick .chip { font-size: 11px; }
  .ba { position: relative; aspect-ratio: 16 / 9; border: 1px solid var(--line2); overflow: hidden; box-shadow: 0 40px 80px -40px #000; }
  .ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ba .after { clip-path: inset(0 0 0 50%); }
  .ba .div { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--ok); }
  .ba .tag { position: absolute; top: 12px; font: 600 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; padding: 5px 9px; background: rgba(0,0,0,.72); border: 1px solid var(--line2); }
  .ba .l { left: 12px; color: var(--dim); }
  .ba .r { right: 12px; color: var(--ok); border-color: var(--ok); }
</style>
</head>
<body>
<div class="b">
  <div class="hero" style="display:block;padding:0">
    <div class="brand"><img src="../../icons/128.png" alt="">anime4nerd</div>
    <div class="phead">browser extension · chrome · brave · edge · firefox</div>
    <h1><span>Sharper</span><span class="o">anime.</span></h1>
    <p class="lede">The original Anime4K neural upscaler, live on your own GPU. Any web video, every frame, 2× to 8×.</p>
    <div class="tick"><span class="chip">anime4k</span><span class="chip">webgl2</span><span class="chip">manga mode</span><span class="chip">no account</span><span class="chip">mit</span></div>
  </div>
  <div class="ba">
    <img src="../../site/assets/frame-before.png" alt="">
    <img class="after" src="../../site/assets/frame-after.png" alt="">
    <i class="div"></i>
    <span class="tag l">browser scaling</span>
    <span class="tag r">anime4nerd · a+a</span>
  </div>
</div>
</body>
</html>
