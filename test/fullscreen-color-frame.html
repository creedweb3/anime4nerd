<!doctype html>
<!-- One "fullscreen screen" for fullscreen-color-demo.html (see fullscreen-color-frame.ts). ?v=A..E -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<title>fullscreen color frame</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
#stage { position: fixed; inset: 0; }
.pic { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
/* a stand-in for the player's own controls, so overlap can be judged */
#player-ui { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; padding: 0 20px; display: grid; grid-template-rows: 18px 1fr; align-items: center;
  background: linear-gradient(transparent, rgba(0,0,0,.7)); color: #fff; font: 13px/1 system-ui, sans-serif; transition: opacity .2s; pointer-events: none; }
#player-ui.idle { opacity: 0; }
.prog { position: relative; height: 3px; background: rgba(255,255,255,.3); }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; width: 33%; background: #e33; }
.ctl { display: flex; align-items: center; gap: 18px; }
.ctl .r { margin-left: auto; display: flex; gap: 18px; }
.ic { width: 18px; height: 18px; border: 2px solid #fff; box-sizing: border-box; }
.play { width: 0; height: 0; border: 9px solid transparent; border-left: 14px solid #fff; border-right: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="player-ui"><div class="prog"><i></i></div><div class="ctl"><span class="play"></span><span>07:42 / 23:40</span><span class="r"><span class="ic"></span><span class="ic"></span></span></div></div>
<!-- Loaded with a timestamp, so a rebuilt bundle always shows on reload (no cached copy). -->
<script type="module">import(`./fullscreen-color-frame.js?${Date.now()}`);</script>
</body>
</html>
