<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Anime4Nerd</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="bar">
    <span class="chip">anime4k</span>
    <span class="chip" id="hint">off</span>
    <span class="chip grow" id="gpuchip">gpu —</span>
    <span class="chip" id="clock"></span>
    <a class="chip bug" id="report" href="https://anime4nerd.pages.dev/report" target="_blank" rel="noopener" title="Report a problem" aria-label="Report a problem">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M5.5 4.5a2.5 2.5 0 0 1 5 0"/><rect x="4.5" y="5" width="7" height="8" rx="3.5"/><path d="M8 7.5V13M2 9h2.5M11.5 9H14M2.5 5l2 1.5M13.5 5l-2 1.5M2.5 13l2-1.5M13.5 13l-2-1.5"/></svg>
    </a>
  </header>

  <a class="update-note" id="whatsnew" href="https://anime4nerd.pages.dev/#changes" target="_blank" rel="noopener" hidden>
    <span><span class="update-label">updated</span><span class="update-dot">●</span> v<b id="whatsnew-ver"></b></span><span class="update-link">what's new →</span>
  </a>

  <section class="rate-card" id="rate" hidden>
    <button type="button" class="rate-x" id="rate-x" title="Hide until the next milestone" aria-label="Hide">✕</button>
    <div class="rate-top">you've upscaled<span class="rate-badge" id="rate-badge"></span></div>
    <div class="rate-big" id="rate-big"></div>
    <div class="rate-row">
      <div class="rate-lines"><span id="rate-l1"></span><br /><span id="rate-l2"></span></div>
      <div class="rate-actions">
        <a class="rate-go" id="rate-go" target="_blank" rel="noopener">★ rate it</a>
        <button type="button" class="rate-done" id="rate-done" hidden>✓ already rated</button>
      </div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><span>playing now</span><span id="count"></span></div>
    <div class="sources" id="sources"></div>
    <p class="empty" id="empty">No video found yet. Start playback, then reopen this popup.</p>
  </section>

  <section class="panel" id="perf">
    <div class="panel-head"><span>performance</span><span class="verdict dim" id="verdict">● off</span></div>
    <div class="kv">
      <div><span>GPU</span><b id="k-load">—</b></div>
      <div><span>Per frame</span><b id="k-ms">—</b></div>
      <div><span>Output</span><b id="k-fps">—</b></div>
      <div><span>Avg · peak</span><b id="k-avg">—</b></div>
      <div><span>Frame limit</span><b id="k-limit">—</b></div>
      <div><span>Late frames</span><b id="k-late">—</b></div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="meta" id="legend">no measurements yet</div>
  </section>

  <section class="panel">
    <div class="panel-head"><span>preset</span><span id="presetName"></span></div>
    <div class="grid" id="presets"></div>
    <div class="pills" id="effects">
      <button type="button" class="pill" data-field="darkenLines" role="menuitemcheckbox">darken lines</button>
      <button type="button" class="pill" data-field="thinLines" role="menuitemcheckbox">thin lines</button>
    </div>
    <div class="pills" id="upscale" role="radiogroup" aria-label="upscale">
      <span class="pills-label">upscale</span>
      <button type="button" class="pill" data-upscale="auto" role="radio" title="4× only when the video is shown at more than 2× its size">auto</button>
      <button type="button" class="pill" data-upscale="2x" role="radio">2×</button>
      <button type="button" class="pill" data-upscale="4x" role="radio" title="Heavier: about 2× the GPU time and memory of 2×">4×</button>
      <button type="button" class="pill" data-upscale="8x" role="radio" title="Experimental. Uses the largest scale up to this that fits your GPU (output capped at 8K).">8×</button>
      <button type="button" class="pill" data-upscale="16x" role="radio" title="Experimental. Uses the largest scale up to this that fits your GPU (output capped at 8K).">16×</button>
      <button type="button" class="pill" data-upscale="32x" role="radio" title="Experimental. Uses the largest scale up to this that fits your GPU (output capped at 8K).">32×</button>
    </div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
